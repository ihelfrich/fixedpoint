<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACCT 410x Diagnostic Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-card {
            background: white;
            padding: 30px;
            margin: 20px 0;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .test-result {
            padding: 15px;
            margin: 10px 0;
            border-left: 4px solid #ccc;
            background: #f8f9fa;
        }
        .success {
            border-color: #28a745;
            background: #d4edda;
        }
        .error {
            border-color: #dc3545;
            background: #f8d7da;
        }
        h1 { color: #990000; }
        h2 { margin-top: 30px; }
        code {
            background: #e9ecef;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
        }
        button {
            background: #990000;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px 10px 0;
        }
        button:hover {
            background: #770000;
        }
        .problem-count {
            font-size: 24px;
            font-weight: bold;
            color: #990000;
        }
    </style>
</head>
<body>
    <div class="test-card">
        <h1>🔍 ACCT 410x Platform Diagnostic Test</h1>
        <p>This page tests if all components are loading correctly.</p>
        <button onclick="runAllTests()">Run All Tests</button>
        <button onclick="location.href='index.html'">Go to Main Platform</button>
    </div>

    <div id="test-results"></div>

    <script src="problems.js"></script>
    <script src="practice-exam.js"></script>
    <script src="app.js"></script>

    <script>
        function runAllTests() {
            const resultsDiv = document.getElementById('test-results');
            resultsDiv.innerHTML = '';

            let html = '<div class="test-card"><h2>Test Results</h2>';

            // Test 1: Check if ProblemBank exists
            html += '<div class="test-result ' + (typeof ProblemBank !== 'undefined' ? 'success' : 'error') + '">';
            html += '<strong>Test 1: ProblemBank Object</strong><br>';
            if (typeof ProblemBank !== 'undefined') {
                html += '✓ ProblemBank is loaded<br>';
                html += `<div class="problem-count">${getAllProblems().length} total problems</div>`;
                html += 'Topics: ' + Object.keys(ProblemBank).join(', ');
            } else {
                html += '✗ ProblemBank is NOT defined';
            }
            html += '</div>';

            // Test 2: Check if PracticeMidterm exists
            html += '<div class="test-result ' + (typeof PracticeMidterm !== 'undefined' ? 'success' : 'error') + '">';
            html += '<strong>Test 2: Practice Midterm</strong><br>';
            if (typeof PracticeMidterm !== 'undefined') {
                html += '✓ PracticeMidterm is loaded<br>';
                html += `Part I: ${PracticeMidterm.partI_MultipleChoice.length} questions<br>`;
                html += `Part II: ${PracticeMidterm.partII_AccountClassification.length} questions<br>`;
                html += `Part III: ${PracticeMidterm.partIII_TransactionAnalysis.length} questions<br>`;
                html += `<div class="problem-count">${PracticeMidterm.partI_MultipleChoice.length + PracticeMidterm.partII_AccountClassification.length + PracticeMidterm.partIII_TransactionAnalysis.length} total exam questions</div>`;
            } else {
                html += '✗ PracticeMidterm is NOT defined';
            }
            html += '</div>';

            // Test 3: Check if functions exist
            html += '<div class="test-result ' + (typeof generateFullPracticeExam === 'function' ? 'success' : 'error') + '">';
            html += '<strong>Test 3: Exam Generator Function</strong><br>';
            if (typeof generateFullPracticeExam === 'function') {
                html += '✓ generateFullPracticeExam() function exists';
            } else {
                html += '✗ generateFullPracticeExam() function NOT found';
            }
            html += '</div>';

            // Test 4: Check if calculateScore exists
            html += '<div class="test-result ' + (typeof calculateScore === 'function' ? 'success' : 'error') + '">';
            html += '<strong>Test 4: Score Calculator Function</strong><br>';
            if (typeof calculateScore === 'function') {
                html += '✓ calculateScore() function exists';
            } else {
                html += '✗ calculateScore() function NOT found';
            }
            html += '</div>';

            // Test 5: Check if AppState exists
            html += '<div class="test-result ' + (typeof AppState !== 'undefined' ? 'success' : 'error') + '">';
            html += '<strong>Test 5: App State Management</strong><br>';
            if (typeof AppState !== 'undefined') {
                html += '✓ AppState is initialized<br>';
                html += `Current section: ${AppState.currentSection}<br>`;
                html += `Problems completed: ${AppState.userProgress.problemsCompleted}`;
            } else {
                html += '✗ AppState is NOT defined';
            }
            html += '</div>';

            // Test 6: Check navigation
            html += '<div class="test-result ' + (typeof navigateToSection === 'function' ? 'success' : 'error') + '">';
            html += '<strong>Test 6: Navigation System</strong><br>';
            if (typeof navigateToSection === 'function') {
                html += '✓ navigateToSection() function exists';
            } else {
                html += '✗ navigateToSection() function NOT found';
            }
            html += '</div>';

            // Test 7: Test generating actual exam
            html += '<div class="test-result">';
            html += '<strong>Test 7: Generate Practice Exam</strong><br>';
            try {
                if (typeof generateFullPracticeExam === 'function') {
                    const exam = generateFullPracticeExam();
                    if (exam && exam.partI && exam.partII && exam.partIII) {
                        html += '<div class="success">';
                        html += '✓ Successfully generated practice exam<br>';
                        html += `Generated ${exam.partI.length} Part I questions<br>`;
                        html += `Generated ${exam.partII.length} Part II questions<br>`;
                        html += `Generated ${exam.partIII.length} Part III questions`;
                        html += '</div>';
                    } else {
                        html += '<div class="error">✗ Exam generated but structure is wrong</div>';
                    }
                } else {
                    html += '<div class="error">✗ Cannot test - function missing</div>';
                }
            } catch(e) {
                html += '<div class="error">✗ Error generating exam: ' + e.message + '</div>';
            }
            html += '</div>';

            // Test 8: Test problem rendering
            html += '<div class="test-result">';
            html += '<strong>Test 8: Problem Rendering</strong><br>';
            try {
                if (typeof renderProblem === 'function' && typeof ProblemBank !== 'undefined') {
                    const allProblems = getAllProblems();
                    if (allProblems.length > 0) {
                        const testProblem = allProblems[0];
                        const rendered = renderProblem(testProblem, 0);
                        if (rendered && rendered.length > 50) {
                            html += '<div class="success">✓ Problem rendering works<br>';
                            html += `Sample rendered HTML: ${rendered.substring(0, 100)}...</div>`;
                        } else {
                            html += '<div class="error">✗ Problem rendering returned empty/short content</div>';
                        }
                    } else {
                        html += '<div class="error">✗ No problems available to test rendering</div>';
                    }
                } else {
                    html += '<div class="error">✗ Cannot test - renderProblem function or ProblemBank missing</div>';
                }
            } catch(e) {
                html += '<div class="error">✗ Error rendering problem: ' + e.message + '</div>';
            }
            html += '</div>';

            // Test 9: Count total content
            html += '<div class="test-result success">';
            html += '<strong>Test 9: Content Summary</strong><br>';
            let totalProblems = 0;
            if (typeof ProblemBank !== 'undefined') {
                totalProblems += getAllProblems().length;
            }
            if (typeof PracticeMidterm !== 'undefined') {
                totalProblems += (PracticeMidterm.partI_MultipleChoice?.length || 0) +
                                 (PracticeMidterm.partII_AccountClassification?.length || 0) +
                                 (PracticeMidterm.partIII_TransactionAnalysis?.length || 0);
            }
            html += `<div class="problem-count">${totalProblems} total practice problems available</div>`;
            html += '</div>';

            html += '</div>';
            resultsDiv.innerHTML = html;
        }

        // Auto-run tests on page load
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(runAllTests, 500);
        });
    </script>
</body>
</html>
